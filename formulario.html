<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Currículo - PH Negócios</title>
    <style>
        /* TODO O SEU ESTILO ATUAL MANTIDO - NÃO ALTEREI NADA */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #1a1a1a;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #FF0000;
            font-size: 32px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ccc;
        }

        .required::after {
            content: ' *';
            color: #FF0000;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #0a0a0a;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #FF0000;
            box-shadow: 0 0 0 3px rgba(255, 0, 0, 0.1);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        .file-upload {
            border: 2px dashed #333;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: #FF0000;
            background: rgba(255, 0, 0, 0.05);
        }

        .file-upload input {
            display: none;
        }

        .btn-submit {
            background: linear-gradient(135deg, #FF0000 0%, #8B0000 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-back {
            background: #333;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: #444;
        }

        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
        }

        .alert-error {
            background: rgba(220, 53, 69, 0.2);
            border: 1px solid #dc3545;
            color: #dc3545;
        }

        .campanha-info {
            background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #FF0000;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .campanha-info h3 {
            color: #FF0000;
            margin-bottom: 5px;
            font-size: 18px;
        }

        .campanha-info p {
            color: #ccc;
            font-size: 14px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enviar Currículo</h1>
        
        <!-- Informações da campanha -->
        <div id="campanhaInfo" class="campanha-info"></div>
        
        <!-- Alertas -->
        <div id="alertSuccess" class="alert alert-success"></div>
        <div id="alertError" class="alert alert-error"></div>
        
        <form id="formCurriculo">
            <div class="form-group">
                <label class="required">Nome Completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            
            <div class="form-group">
                <label class="required">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label class="required">Telefone</label>
                <input type="tel" id="telefone" name="telefone" required>
            </div>
            
            <div class="form-group">
                <label class="required">Vaga de Interesse</label>
                <input type="text" id="vaga" name="vaga" required readonly>
            </div>
            
            <div class="form-group">
                <label class="required">Experiência Profissional</label>
                <textarea id="experiencia" name="experiencia" required></textarea>
            </div>
            
            <div class="form-group">
                <label>Mensagem (opcional)</label>
                <textarea id="mensagem" name="mensagem"></textarea>
            </div>
            
            <div class="form-group">
                <label class="required">Currículo (PDF, DOC, DOCX - até 5MB)</label>
                <div class="file-upload" onclick="document.getElementById('curriculo').click()">
                    <span id="fileName">Clique para selecionar arquivo</span>
                    <input type="file" id="curriculo" name="curriculo" accept=".pdf,.doc,.docx" required>
                </div>
            </div>
            
            <input type="hidden" id="campanha_id" name="campanha_id">
            
            <button type="submit" class="btn-submit" id="btnSubmit">Enviar Currículo</button>
        </form>
        
        <a href="./index.html" class="btn-back">← Voltar para a página inicial</a>
    </div>

    <script>
        // Configurações
        const API_BASE_URL = 'https://phapp.phng.com.br/api';
        
        // Elementos DOM
        const form = document.getElementById('formCurriculo');
        const vagaInput = document.getElementById('vaga');
        const campanhaIdInput = document.getElementById('campanha_id');
        const campanhaInfo = document.getElementById('campanhaInfo');
        const alertSuccess = document.getElementById('alertSuccess');
        const alertError = document.getElementById('alertError');
        const btnSubmit = document.getElementById('btnSubmit');
        const fileInput = document.getElementById('curriculo');
        const fileName = document.getElementById('fileName');
        
        // Função para mostrar alerta
        function showAlert(element, message) {
            element.textContent = message;
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }
        
        // Carregar informações da campanha
        async function loadCampanhaInfo() {
            const urlParams = new URLSearchParams(window.location.search);
            const campanhaId = urlParams.get('campanha');
            
            if (campanhaId) {
                try {
                    const response = await fetch(`${API_BASE_URL}/campanhas/ativas?campanha_id=${campanhaId}`);
                    const data = await response.json();
                    
                    if (data.success && data.data.data.length > 0) {
                        const campanha = data.data.data[0];
                        
                        // Preencher campos
                        vagaInput.value = campanha.vaga;
                        campanhaIdInput.value = campanhaId;
                        
                        // Mostrar informações da campanha
                        campanhaInfo.innerHTML = `
                            <h3>${campanha.titulo}</h3>
                            <p>Campanha ativa | ${campanha.dias_restantes} dias restantes</p>
                        `;
                        campanhaInfo.style.display = 'block';
                        
                        // Verificar se tem vagas disponíveis
                        if (campanha.vagas_disponiveis && campanha.vagas_preenchidas >= campanha.vagas_disponiveis) {
                            showAlert(alertError, 'Esta campanha não tem mais vagas disponíveis');
                            btnSubmit.disabled = true;
                            btnSubmit.textContent = 'VAGAS ESGOTADAS';
                        }
                    }
                } catch (error) {
                    console.error('Erro ao carregar campanha:', error);
                }
            } else {
                // Verificar se veio do localStorage (para vagas fixas)
                const vagaSelecionada = localStorage.getItem('vaga_selecionada');
                if (vagaSelecionada) {
                    vagaInput.value = vagaSelecionada;
                    localStorage.removeItem('vaga_selecionada');
                }
            }
        }
        
        // Configurar input de arquivo
        fileInput.addEventListener('change', function(e) {
            if (this.files[0]) {
                fileName.textContent = this.files[0].name;
                
                // Validar tamanho (5MB)
                if (this.files[0].size > 5 * 1024 * 1024) {
                    showAlert(alertError, 'O arquivo deve ter no máximo 5MB');
                    this.value = '';
                    fileName.textContent = 'Clique para selecionar arquivo';
                }
                
                // Validar extensão
                const allowedExtensions = ['.pdf', '.doc', '.docx'];
                const fileExtension = '.' + this.files[0].name.split('.').pop().toLowerCase();
                
                if (!allowedExtensions.includes(fileExtension)) {
                    showAlert(alertError, 'Formato não permitido. Use PDF, DOC ou DOCX');
                    this.value = '';
                    fileName.textContent = 'Clique para selecionar arquivo';
                }
            }
        });
        
        // Enviar formulário
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Validar arquivo
            if (!fileInput.files[0]) {
                showAlert(alertError, 'Selecione um arquivo de currículo');
                return;
            }
            
            // Desabilitar botão
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'ENVIANDO...';
            
            // Criar FormData
            const formData = new FormData();
            formData.append('nome', document.getElementById('nome').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('telefone', document.getElementById('telefone').value);
            formData.append('vaga', document.getElementById('vaga').value);
            formData.append('experiencia', document.getElementById('experiencia').value);
            formData.append('mensagem', document.getElementById('mensagem').value);
            formData.append('curriculo', fileInput.files[0]);
            
            // Adicionar campanha_id se existir
            const campanhaId = campanhaIdInput.value;
            if (campanhaId) {
                formData.append('campanha_id', campanhaId);
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/curriculos`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Mostrar sucesso
                    showAlert(alertSuccess, 'Currículo enviado com sucesso! Entraremos em contato em breve.');
                    
                    // Limpar formulário
                    form.reset();
                    fileName.textContent = 'Clique para selecionar arquivo';
                    campanhaInfo.style.display = 'none';
                    
                    // Desabilitar envio novamente
                    btnSubmit.disabled = true;
                    btnSubmit.textContent = 'ENVIADO COM SUCESSO';
                    
                    // Redirecionar após 3 segundos
                    setTimeout(() => {
                        window.location.href = './index.html';
                    }, 3000);
                } else {
                    // Mostrar erro
                    if (data.errors) {
                        let errorMessage = '';
                        for (const field in data.errors) {
                            errorMessage += data.errors[field][0] + '\n';
                        }
                        showAlert(alertError, errorMessage);
                    } else {
                        showAlert(alertError, data.message || 'Erro ao enviar currículo');
                    }
                    
                    // Reabilitar botão
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Enviar Currículo';
                }
            } catch (error) {
                console.error('Erro:', error);
                showAlert(alertError, 'Erro de conexão. Tente novamente.');
                
                // Reabilitar botão
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Enviar Currículo';
            }
        });
        
        // Máscara para telefone
        document.getElementById('telefone').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            
            if (value.length <= 10) {
                value = value.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3');
            } else {
                value = value.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
            }
            
            e.target.value = value;
        });
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            loadCampanhaInfo();
        });
    </script>
</body>
</html>
